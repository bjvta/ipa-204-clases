<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="527" height="330" fill="#ffffff"/>
  <g font-size="25">
    <rect x="24" y="28" width="479" height="78" rx="22" fill="#f4f1e6"/>
    <text x="48" y="76" fill="#5b6f62">Si <tspan font-weight="bold">frío</tspan> → potencia <tspan font-weight="bold">alta</tspan></text>
    <rect x="410" y="45" width="76" height="44" rx="14" fill="#dfe7d4"/><text x="448" y="76" text-anchor="middle" font-weight="bold" fill="#5b6f62">0</text>
    <rect x="24" y="126" width="479" height="78" rx="22" fill="#1e3d2f"/>
    <text x="48" y="174" fill="#f4f1e6">Si <tspan font-weight="bold">justo</tspan> → potencia <tspan font-weight="bold">media</tspan></text>
    <rect x="410" y="143" width="76" height="44" rx="14" fill="#f0973a"/><text x="448" y="174" text-anchor="middle" font-weight="bold" fill="#1e3d2f">0,75</text>
    <rect x="24" y="224" width="479" height="78" rx="22" fill="#f4f1e6"/>
    <text x="48" y="272" fill="#1e3d2f">Si <tspan font-weight="bold">caliente</tspan> → potencia <tspan font-weight="bold">baja</tspan></text>
    <rect x="410" y="241" width="76" height="44" rx="14" fill="#c8553d"/><text x="448" y="272" text-anchor="middle" font-weight="bold" fill="#ffffff">0,25</text>
  </g>
</svg>
